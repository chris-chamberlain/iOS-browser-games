<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Brick Elementals</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd8ff; overscroll-behavior: none;
    font-family: -apple-system, system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .ui { position: fixed; pointer-events: none; }
  #hud { top: calc(env(safe-area-inset-top) + 8px); left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; }
  #hearts { font-size: clamp(16px, 3.6vw, 26px); letter-spacing: 1px; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  #studs { font-weight: 800; font-size: clamp(18px, 4vw, 26px); color: #fff; text-shadow: 0 2px 0 #b07a00, 0 3px 6px rgba(0,0,0,.35); }
  #obj { top: calc(env(safe-area-inset-top) + 56px); left: 14px; display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800;
    font-size: clamp(14px, 3vw, 20px); text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  #arrow { width: 40px; height: 40px; border-radius: 50%; background: rgba(20,40,80,.55); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  #bossbar { top: calc(env(safe-area-inset-top) + 8px); left: 50%; transform: translateX(-50%); width: min(46vw, 420px); text-align: center; color: #fff;
    font-weight: 800; text-shadow: 0 2px 0 #3b1d6e; display: none; }
  #bossbar .bar { height: 14px; background: rgba(0,0,0,.4); border-radius: 8px; overflow: hidden; margin-top: 2px; border: 2px solid #3b1d6e; }
  #bossfill { height: 100%; width: 100%; background: linear-gradient(#c58bff, #8a3fe0); transition: width .15s; }
  #toast { top: 24%; left: 0; right: 0; text-align: center; font-size: clamp(22px, 5vw, 38px); font-weight: 900; color: #fff;
    text-shadow: 0 3px 0 #2a4a80, 0 5px 14px rgba(0,0,0,.4); opacity: 0; transition: opacity .35s; padding: 0 20px; }
  #pause { top: calc(env(safe-area-inset-top) + 46px); right: 14px; width: 50px; height: 50px; font-size: 22px; background: rgba(20,40,80,.65); display: none; align-items: center; justify-content: center; }
  #pausemenu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20, 40, 80, .55); padding: 20px; box-sizing: border-box; }
  #pcard { background: #fff; border-radius: 24px; padding: 22px 26px; width: min(86vw, 380px); text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.2); }
  #pcard h1 { margin: 0 0 12px; font-size: 34px; color: #1d4a75; }
  .pb { display: block; width: 100%; margin: 10px 0 0; font-size: 22px; font-weight: 800; color: #fff; background: #2f8be8; border: 0; border-radius: 14px; padding: 13px 10px; box-shadow: 0 4px 0 #1d5fa8; }
  .pb.green { background: #3ac26a; box-shadow: 0 4px 0 #23864a; } .pb.red { background: #d9534f; box-shadow: 0 4px 0 #9a2f2c; }
  .btn { pointer-events: auto; border: 0; border-radius: 50%; color: #fff; font-weight: 800; touch-action: none; position: relative; overflow: hidden;
    box-shadow: 0 5px 0 rgba(0,0,0,.3), inset 0 3px 0 rgba(255,255,255,.35); -webkit-tap-highlight-color: transparent; }
  .btn:active { transform: translateY(3px); }
  :root { --u: clamp(52px, 10.5vmin, 84px); }
  #buttons { right: calc(env(safe-area-inset-right) + 14px); bottom: calc(env(safe-area-inset-bottom) + 18px); width: calc(var(--u) * 4.1); height: calc(var(--u) * 3); }
  #buttons .btn { position: absolute; font-size: calc(var(--u) * 0.5); padding: 0; }
  #buttons #atk { right: 0; bottom: 0; width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5); font-size: calc(var(--u) * 0.66); background: radial-gradient(circle at 35% 30%, #6cc4ff, #2477d8); }
  #buttons #block { right: calc(var(--u) * 1.65); bottom: calc(var(--u) * 0.1); width: calc(var(--u) * 1.15); height: calc(var(--u) * 1.15); background: radial-gradient(circle at 35% 30%, #ffe27a, #e0a000); }
  #buttons #roll { right: calc(var(--u) * 0.55); bottom: calc(var(--u) * 1.7); width: calc(var(--u) * 1.05); height: calc(var(--u) * 1.05); background: radial-gradient(circle at 35% 30%, #7fe3a0, #25a05a); }
  #buttons #spec { right: calc(var(--u) * 1.9); bottom: calc(var(--u) * 1.55); width: calc(var(--u) * 0.95); height: calc(var(--u) * 0.95); background: radial-gradient(circle at 35% 30%, #b99cff, #6a45c8); }
  #buttons #dash { right: calc(var(--u) * 3.1); bottom: calc(var(--u) * 0.75); width: calc(var(--u) * 0.95); height: calc(var(--u) * 0.95); background: radial-gradient(circle at 35% 30%, #ffd84a, #e09a00); display: none; }
  #stick { left: calc(env(safe-area-inset-left) + 26px); bottom: calc(env(safe-area-inset-bottom) + 26px); width: calc(var(--u) * 2.2); height: calc(var(--u) * 2.2); border-radius: 50%;
    background: rgba(255,255,255,.28); border: 3px solid rgba(255,255,255,.75); pointer-events: auto; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 0.95); height: calc(var(--u) * 0.95); margin: calc(var(--u) * -0.475) 0 0 calc(var(--u) * -0.475); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7fd0ff, #2f8be8); box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #stam { top: calc(env(safe-area-inset-top) + 36px); left: 14px; width: 120px; height: 9px; background: rgba(0,0,0,.4); border-radius: 6px; overflow: hidden; border: 2px solid #fff; }
  #stamfill { height: 100%; width: 100%; background: linear-gradient(#ffe27a, #e0a000); }
  .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.55); }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20, 40, 80, .5); padding: 20px; box-sizing: border-box; }
  #card { background: #fff; border-radius: 24px; padding: 22px 26px; max-width: 440px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.2); }
  #card h1 { margin: 0 0 4px; font-size: clamp(26px, 7vw, 40px); color: #1d4a75; }
  #card h2 { margin: 0 0 10px; font-size: 18px; color: #6a7f95; }
  #card p { margin: 8px 0; font-size: 17px; color: #2b3a4a; line-height: 1.35; }
  #go { margin-top: 12px; font-size: 26px; font-weight: 800; color: #fff; background: #3ac26a; border: 0; border-radius: 16px; padding: 12px 38px; box-shadow: 0 5px 0 #23864a; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 20px; font-weight: 600; color: #7a1f1f; background: #ffe9e9; }
</style>
</head>
<body>
<div id="hud" class="ui"><div id="hearts"></div><div id="studs"></div></div>
<div id="obj" class="ui"><div id="arrow">▲</div><div id="objt"></div></div>
<div id="bossbar" class="ui"><div>Morvo Murk</div><div class="bar"><div id="bossfill"></div></div></div>
<div id="toast" class="ui"></div>
<div id="stick" class="ui"><div id="knob"></div></div>
<div id="stam" class="ui"><div id="stamfill"></div></div>
<button id="pause" class="btn ui">⏸</button>
<div id="buttons" class="ui">
  <button id="dash" class="btn">⚡<span class="cd"></span></button>
  <button id="spec" class="btn">🌪<span class="cd"></span></button>
  <button id="roll" class="btn">🤸<span class="cd"></span></button>
  <button id="block" class="btn">🛡<span class="cd"></span></button>
  <button id="atk" class="btn">💨</button>
</div>
<div id="overlay"><div id="card">

</div></div>
<div id="pausemenu"><div id="pcard">

  <button id="p-resume" class="pb green">Resume</button>
  <button id="p-cam" class="pb">Camera: Close</button>
  <button id="p-check" class="pb">Restart at checkpoint</button>
  <button id="p-new" class="pb">Start the level over</button>
  <button id="p-quit" class="pb red">Quit to title</button>
</div></div>
<div id="err">The 3D engine did not load. Check the internet and reload.</div>

<script type="module">
let THREE;
try { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'); }
catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }

const $ = (id) => document.getElementById(id);
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let _seed = 20261101;
const srnd = () => { _seed = (_seed * 16807) % 2147483647; return _seed / 2147483647; };
const srange = (a, b) => a + srnd() * (b - a);
const BOSS_MAX = 36, HERO_MAX = 10;

// =====================================================================
// renderer, sky, lights
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#2f7fe0'); g.addColorStop(0.45, '#7cc3ff'); g.addColorStop(0.75, '#cfeeff'); g.addColorStop(1, '#fff3dc');
  x.fillStyle = g; x.fillRect(0, 0, 4, 512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}
scene.fog = new THREE.Fog(0xcfe9ff, 70, 230);
const camera = new THREE.PerspectiveCamera(48, 1, 0.5, 400);
scene.add(new THREE.HemisphereLight(0xdcefff, 0x8a7a6a, 0.95));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 100 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);

let baseFov = 48;
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  baseFov = w / h < 0.8 ? 62 : 48; camera.fov = baseFov;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// =====================================================================
// batching: thousands of colored boxes and studs in a few draw calls
// =====================================================================
const dummy = new THREE.Object3D(), _c = new THREE.Color();
const unitBox = new THREE.BoxGeometry(1, 1, 1);
const studGeoS = new THREE.CylinderGeometry(0.34, 0.34, 0.2, 10);
const matBatch = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.62 });
const matGlow = new THREE.MeshBasicMaterial({ color: 0xffffff });
class Batch {
  constructor() { this.b = []; this.s = []; this.g = []; }
  bx(x, y0, z, sx, sy, sz, col, ry = 0) { this.b.push([x, y0 + sy / 2, z, sx, sy, sz, col, ry]); }
  gl(x, y0, z, sx, sy, sz, col) { this.g.push([x, y0 + sy / 2, z, sx, sy, sz, col, 0]); }
  st(x, y, z, col, sc = 1) { this.s.push([x, y, z, col, sc]); }
  build(parent, cast = true) {
    const mk = (list, geo, mat, isStud) => {
      if (!list.length) return;
      const im = new THREE.InstancedMesh(geo, mat, list.length);
      list.forEach((it, i) => {
        dummy.position.set(it[0], it[1], it[2]);
        if (isStud) { dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(it[4]); _c.setHex(it[3]); }
        else { dummy.rotation.set(0, it[7], 0); dummy.scale.set(it[3], it[4], it[5]); _c.setHex(it[6]); }
        dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); im.setColorAt(i, _c);
      });
      im.instanceMatrix.needsUpdate = true; im.instanceColor.needsUpdate = true;
      im.castShadow = cast && mat !== matGlow; im.receiveShadow = mat !== matGlow; im.frustumCulled = false;
      parent.add(im);
    };
    mk(this.b, unitBox, matBatch, false); mk(this.s, studGeoS, matBatch, true); mk(this.g, unitBox, matGlow, false);
  }
}

// brick wall texture for cliffs and stone
function brickTexture(base, mortar) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = mortar; x.fillRect(0, 0, 128, 128);
  for (let row = 0; row < 8; row++) {
    for (let col = -1; col < 5; col++) {
      const ox = (row % 2) * 16 + col * 32, v = 18 + Math.floor(srnd() * 28);
      x.fillStyle = `rgb(${base[0] + v - 20},${base[1] + v - 20},${base[2] + v - 20})`;
      x.fillRect(ox + 1.5, row * 16 + 1.5, 29, 13);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const cliffTex = brickTexture([150, 125, 100], '#5a4a3c');
const stoneTex = brickTexture([120, 120, 135], '#3a3a48');
function tiled(tex, rx, ry) { const t = tex.clone(); t.needsUpdate = true; t.repeat.set(rx, ry); return t; }

// =====================================================================
// level layout (hero walks north, toward -z)
// =====================================================================
const ISL = [
  { name: 'Landing',        cx: 0,  cz: 0,    r: 12, entry: [0, 10] },
  { name: 'Garden Isle',    cx: 0,  cz: -50,  r: 16, entry: [0, -34] },
  { name: 'Windmill Isle',  cx: 0,  cz: -100, r: 14, entry: [0, -86] },
  { name: 'Orchard Isle',   cx: 46, cz: -100, r: 14, entry: [32, -100] },
  { name: 'Fortress Isle',  cx: 46, cz: -150, r: 15, entry: [46, -136] },
  { name: "Morvo's Arena",  cx: 46, cz: -215, r: 22, entry: [46, -194] },
];
const BR = [
  { x0: -2.5, x1: 2.5,  z0: -37,   z1: -9,   ax: 'z' },
  { x0: -2.5, x1: 2.5,  z0: -89,   z1: -63,  ax: 'z' },
  { x0: 11,   x1: 35,   z0: -102.5, z1: -97.5, ax: 'x' },
  { x0: 43.5, x1: 48.5, z0: -138,  z1: -111, ax: 'z' },
  { x0: 43.5, x1: 48.5, z0: -196,  z1: -162, ax: 'z' },
];
const GATE_DEF = [
  { x: 0,  z: -76,  ax: 'z' }, { x: 23, z: -100, ax: 'x' },
  { x: 46, z: -125, ax: 'z' }, { x: 46, z: -180, ax: 'z' },
  { x: 46, z: -194, ax: 'z', lock: true },
];
const ENC_DEF = [
  { isl: 1, gate: 0, waves: [['grunt', 'grunt'], ['grunt', 'thrower'], ['grunt', 'grunt', 'thrower']] },
  { isl: 2, gate: 1, waves: [['grunt', 'grunt', 'thrower'], ['shielder', 'grunt', 'thrower'], ['charger', 'thrower', 'grunt']] },
  { isl: 3, gate: 2, waves: [['grunt', 'charger', 'thrower'], ['shielder', 'healer', 'grunt'], ['grunt', 'grunt', 'thrower', 'charger']] },
  { isl: 4, gate: 3, waves: [['brute'], ['grunt', 'grunt', 'thrower', 'healer'], ['charger', 'shielder', 'thrower', 'grunt']] },
];
const START = { x: 0, z: 5 };

const areas = [];
ISL.forEach((i) => areas.push({ t: 'c', cx: i.cx, cz: i.cz, r: i.r }));
BR.forEach((b) => areas.push({ t: 'r', x0: b.x0, x1: b.x1, z0: b.z0, z1: b.z1 }));
const gates = [];
const pillars = [];
function walkableBase(x, z, m = 0.6) {
  let ok = false;
  for (const a of areas) {
    if (a.t === 'c') { if (Math.hypot(x - a.cx, z - a.cz) < a.r - m) { ok = true; break; } }
    else if (x > a.x0 + m && x < a.x1 - m && z > a.z0 + m && z < a.z1 - m) { ok = true; break; }
  }
  if (!ok) return false;
  for (const g of gates) if (!g.open && x > g.x0 - m && x < g.x1 + m && z > g.z0 - m && z < g.z1 + m) return false;
  return true;
}
function walkable(x, z, m = 0.6) {
  if (!walkableBase(x, z, m)) return false;
  for (const q of pillars) if (Math.hypot(x - q.x, z - q.z) < q.r + m * 0.6) return false;
  return true;
}
function tryMove(p, dx, dz, m = 0.6) {
  let moved = false;
  if (walkableBase(p.x + dx, p.z, m)) { p.x += dx; moved = true; }
  if (walkableBase(p.x, p.z + dz, m)) { p.z += dz; moved = true; }
  for (const q of pillars) {                      // slide around pillars instead of sticking to them
    const ox = p.x - q.x, oz = p.z - q.z, d = Math.hypot(ox, oz), min = q.r + m * 0.6;
    if (d < min) { const k = min / (d || 0.001); p.x = q.x + (d ? ox * k : min); p.z = q.z + (d ? oz * k : 0); }
  }
  return moved;
}
function bridgeAngles(isl) {
  const out = [];
  for (const b of BR) {
    const px = clamp(isl.cx, b.x0, b.x1), pz = clamp(isl.cz, b.z0, b.z1);
    if (Math.hypot(px - isl.cx, pz - isl.cz) < isl.r + 1) out.push(Math.atan2(pz - isl.cz, px - isl.cx));
  }
  return out;
}
const angDiff = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));

// =====================================================================
// build the world
// =====================================================================
const world = new THREE.Group(); scene.add(world);
const base = new Batch();            // always visible scenery
const GRAY_TOP = new THREE.Color(0x9a9aa8), GREEN_TOP = new THREE.Color(0x6cc659);
const STUD_COLORS = [0xff5a36, 0x2f9bff, 0xf6e04b, 0x3ac26a, 0xb36bff, 0xff8fd0];
const GRAY = new THREE.Color(0x8a8a98);
const tmpC = new THREE.Color(), tmpC2 = new THREE.Color();
const FOLIAGE = [0x2f9a3a, 0x3fb34a, 0x58cc5c];
const FLOWER = [0xff5a6e, 0xffd23f, 0xff9bd2, 0xffffff, 0xb36bff];

function makeTree(b, x, z, s) {
  const br = 0x7a5230, br2 = 0x8c6038;
  b.bx(x, 0, z, 0.95 * s, 1.5 * s, 0.95 * s, br); b.bx(x, 1.5 * s, z, 0.8 * s, 1.1 * s, 0.8 * s, br2);
  for (let k = 0; k < 3; k++) {
    const w = (4.0 - k * 1.2) * s, y = (2.3 + k * 1.1) * s;
    b.bx(x, y, z, w, 1.1 * s, w, FOLIAGE[k], srange(-0.2, 0.2));
  }
  for (const [dx, dz] of [[-0.4, -0.4], [0.4, -0.4], [-0.4, 0.4], [0.4, 0.4]]) b.st(x + dx * s, 5.5 * s + 0.1, z + dz * s, FOLIAGE[2], s);
}
function makeRock(b, x, z, s) {
  let y = 0;
  for (let k = 0; k < 3; k++) {
    const w = (1.8 - k * 0.45) * s, h = 0.8 * s;
    b.bx(x + srange(-0.2, 0.2), y, z + srange(-0.2, 0.2), w, h, w * srange(0.8, 1.1), [0x8a8a96, 0x9a9aa8, 0x7a7a88][k], srange(0, 3));
    y += h;
  }
}
function makePole(b, x, z, col) {
  b.bx(x, 0, z, 0.22, 4.6, 0.22, 0x5a4a3a);
  b.bx(x + 0.55, 2.7, z, 1.0, 1.6, 0.08, col); b.bx(x + 0.55, 2.55, z, 0.9, 0.2, 0.09, 0x2a1a44);
  b.gl(x, 4.6, z, 0.34, 0.34, 0.34, 0xffd27a);
}

const islands = ISL.map((d, idx) => {
  const isl = Object.assign({ idx, p: 0, tp: 0, painted: -1 }, d);
  const r = d.r;
  isl.topMat = new THREE.MeshStandardMaterial({ color: 0x9a9aa8, roughness: 0.85 });
  const top = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 48), isl.topMat);
  top.position.set(d.cx, -0.5, d.cz); top.receiveShadow = true; world.add(top);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.3, r + 0.3, 0.55, 48),
    new THREE.MeshStandardMaterial({ map: tiled(stoneTex, Math.round(r * 1.6), 1), color: 0xcccccc, roughness: 0.9 }));
  rim.position.set(d.cx, -0.28, d.cz); rim.receiveShadow = true; rim.castShadow = true; world.add(rim);
  const cliff = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.25, r * 0.42, r * 0.85, 40),
    new THREE.MeshStandardMaterial({ map: tiled(cliffTex, Math.round(r * 1.4), Math.round(r * 0.45)), color: 0xd8c8b8, roughness: 0.95 }));
  cliff.position.set(d.cx, -0.55 - r * 0.425, d.cz); cliff.castShadow = true; world.add(cliff);
  const spikeMat = new THREE.MeshStandardMaterial({ map: tiled(cliffTex, 3, 2), color: 0xb8a898, roughness: 0.95 });
  for (let k = 0; k < 5; k++) {
    const a = k / 5 * TAU, rr = k === 0 ? 0 : r * 0.16;

          windup(e, 0.5, () => { const q = hero.m.position, w = e.m.position; if (Math.hypot(q.x - w.x, q.z - w.z) < 2.6) hurtHero(1, w.x, w.z, 'melee', e); });
        }
      }
    }
    if (e.cd <= 0) { e.cd = e.type === 'healer' ? 3.4 : 8; if (!allyAid(e, dt)) e.cd = 1; }
    if (e.type === 'shielder' && !e.lastStand) faceTo(e.m, hp.x, hp.z);
  }
  if (applyKnock(e, dt)) return;
  walkAnim(e, moving, t);
  e.flashT -= dt; applyFlash(e);
}

// =====================================================================
// progression
// =====================================================================
function pickSpawn(enc, minHeroDist) {
  const i = enc.isl, hp = hero.m.position;
  for (let k = 0; k < 24; k++) {
    const a = rnd(0, TAU), rr = i.r * rnd(0.2, 0.7), x = i.cx + Math.cos(a) * rr, z = i.cz + Math.sin(a) * rr;
    if (walkable(x, z, 1.4) && Math.hypot(x - hp.x, z - hp.z) >= minHeroDist) return [x, z];
  }
  return [i.cx, i.cz];
}
function spawnWave(enc, wi) {
  enc.wi = wi; enc.nextT = 0;
  for (const ty of enc.waves[wi]) {
    const [x, z] = pickSpawn(enc, wi > 0 ? 9 : 0);
    spawnEnemy(ty, x, z, enc, wi > 0);
    if (wi > 0) burst(x, 0.8, z, [0x8a3fb8, 0x3b1d6e], 8, 3);
  }
  if (wi > 0) toast('Wave ' + (wi + 1) + ' of ' + enc.waves.length + '!', 1500);
}
function spawnEncounter(enc) { enc.spawned = true; spawnWave(enc, 0); }
function clearEncounter(enc, idx) {
  enc.cleared = true; enc.isl.tp = 1;
  const g = gates[enc.gate]; g.open = true;
  burst(g.g.position.x, 2, g.g.position.z, [0x4b4766, 0xc58bff, 0x3d3a52], 22, 6);
  checkpoint = { x: enc.isl.cx, z: enc.isl.cz + 3 };
  toast(idx === ENC.length - 1 ? 'The way to Morvo Murk is open!' : 'The gate is open! Keep going!', 2600);
  dropStuds(enc.isl.cx, enc.isl.cz, 14);
}
function startBoss() {
  bossActive = true; boss = spawnBoss();
  const g = gates[4]; g.open = false;                       // lock the arena
  toast('Morvo Murk: "The Core is MINE!"', 3000);
  updateHud();
}

// =====================================================================
// main loop
// =====================================================================
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 17, 20), camLook = new THREE.Vector3(), want = new THREE.Vector3();
let camScale = 1;
let pauseVis = '';
function frame() {
  if (mode === 'paused') { clock.getDelta(); renderer.render(scene, camera); return; }
  const pv = (mode === 'play') ? 'flex' : 'none'; if (pv !== pauseVis) { pauseVis = pv; $('pause').style.display = pv; }
  let dt = Math.min(clock.getDelta(), 0.05);
  if (hitStop > 0) { hitStop -= dt; dt *= 0.12; }
  t += dt;
  mill.blades.rotation.z += dt * 1.1; mill.clouds.position.x = Math.sin(t * 0.04) * 14;
  if (mill.rune2) mill.rune2.rotation.z += dt * 0.3;
  for (const isl of islands) {
    if (isl.p !== isl.tp) { isl.p += clamp(isl.tp - isl.p, -dt * 0.45, dt * 0.45); }
    paintIsland(isl);
  }
  // gate animation
  for (const g of gates) {
    const goal = g.open ? -5 : 0;
    if (Math.abs(g.wy - goal) > 0.01) { g.wy += clamp(goal - g.wy, -dt * 4, dt * 4); g.wall.position.y = g.wy; g.wall.visible = g.wy > -4.9; }
  }
  const camFocus = new THREE.Vector3();
  if (mode === 'menu') {
    camPos.set(Math.sin(t * 0.15) * 26, 12, Math.cos(t * 0.15) * 26 + 0); camLook.set(0, 2, 0);
    sun.position.set(14, 26, 10); sun.target.position.set(0, 0, 0);
  } else {
    const hp = hero.m.position;
    if (mode === 'play') {
      hero.atkCd -= dt; hero.specCd -= dt; hero.dashCd -= dt; hero.rollCd -= dt; hero.guardCd -= dt; hero.guardBreak -= dt; hero.comboT += dt; hero.inv -= dt; hero.buffer -= dt; hero.moving = false;
      if (hero.tornT > 0) {                                  // the tornado drags everyone into a bunch in front of you
        hero.tornT -= dt;
        const cx = hp.x + Math.sin(hero.face) * 2.8, cz = hp.z + Math.cos(hero.face) * 2.8;
        for (const e of enemies) {
          if (e.isBoss) continue;
          const dx = cx - e.m.position.x, dz = cz - e.m.position.z, d = Math.hypot(dx, dz) || 1;
          if (Math.hypot(e.m.position.x - hp.x, e.m.position.z - hp.z) < 10) {
            const sp = Math.min(14, d * 6); e.vx = (dx / d) * sp; e.vz = (dz / d) * sp;
            e.stun = Math.max(e.stun, 1.3); e.wind = 0; e.warn = false; e.charging = 0; dropLine(e);
          }
        }
        if (hero.tornT <= 0) {
          ringFx(hp.x, hp.z, 0xdff4ff, 8, 0.4, 0.6); shake = Math.max(shake, 0.25);
          for (const e of enemies.slice()) if (Math.hypot(e.m.position.x - hp.x, e.m.position.z - hp.z) < 10) hurt(e, 1, 0, 0, { big: true });
        }
      }
      if (hero.rollT > 0) {
        hero.rollT -= dt; hero.guard = false;
        const k = Math.max(0, hero.rollT / ROLL_T), sp = 5 + 11 * k;
        tryMove(hp, hero.rollDx * sp * dt, hero.rollDz * sp * dt, 0.55);
        hero.vx = hero.rollDx * sp; hero.vz = hero.rollDz * sp; hero.speed = sp; hero.moving = true; hero.face = Math.atan2(hero.rollDx, hero.rollDz);
        if (Math.random() < 0.5) burst(hp.x, 0.2, hp.z, [0xffffff, 0xd8e8f0], 1, 1.2);
      } else if (hero.dashT > 0) {
        hero.dashT -= dt; hero.guard = false;
        const moved = tryMove(hp, Math.sin(hero.face) * 36 * dt, Math.cos(hero.face) * 36 * dt, 0.55);
        if (!moved) hero.dashT = 0;
        for (const e of enemies.slice()) if (!hero.dashHit.has(e) && Math.hypot(e.m.position.x - hp.x, e.m.position.z - hp.z) < 2) { hero.dashHit.add(e); hurt(e, 2, Math.sin(hero.face) * 10, Math.cos(hero.face) * 10, { big: true }); }
        hero.moving = true;
        if (Math.random() < 0.6) burst(hp.x, 1, hp.z, [0xf0b400, 0xffffff], 1, 1.5);
      } else {
        const fighting = hero.held || hero.buffer > 0;
        const mag = Math.hypot(stick.x, stick.z);
        const wantGuard = hero.blockHeld && hero.guardBreak <= 0 && hero.swing < 0.5;
        if (wantGuard && !hero.guard) { hero.guard = true; hero.guardT = hero.guardCd > 0 ? 99 : 0; }
        else if (!wantGuard && hero.guard) { hero.guard = false; hero.guardCd = 0.5; }
        if (hero.guard) hero.guardT += dt; else hero.stamina = Math.min(100, hero.stamina + 22 * dt);
        const MAXV = 10 * (hero.guard ? 0.5 : 1) * (hero.swing > 0.2 ? 0.55 : 1);
        let tvx = 0, tvz = 0;
        if (mag > 0.16) { const k = clamp((mag - 0.16) / 0.7, 0, 1) * MAXV / mag; tvx = stick.x * k; tvz = stick.z * k; hero.face = Math.atan2(stick.x, stick.z); }
        const acc = (tvx || tvz) ? 16 : 11;
        hero.vx += (tvx - hero.vx) * Math.min(1, acc * dt); hero.vz += (tvz - hero.vz) * Math.min(1, acc * dt);
        const lk = Math.exp(-9 * dt); hero.lx *= lk; hero.lz *= lk;
        const sp = Math.hypot(hero.vx, hero.vz);
        const moved = tryMove(hp, (hero.vx + hero.lx) * dt, (hero.vz + hero.lz) * dt, 0.55);
        if (!moved) { hero.vx *= 0.5; hero.vz *= 0.5; }
        hero.speed = sp; hero.moving = sp > 1.5;
        if (hero.moving && (dustT -= dt) <= 0) { dustT = 0.13; burst(hp.x, 0.2, hp.z, [0xffffff, 0xd8e8f0], 1, 1.0); }
        if (fighting && !hero.guard && hero.atkCd <= 0) heroAttack();
      }
      // spawn encounters as the hero approaches
      for (const enc of ENC) {
        if (!enc.spawned && !enc.cleared && Math.hypot(hp.x - enc.isl.cx, hp.z - enc.isl.cz) < enc.isl.r + 22) spawnEncounter(enc);
      }
      if (!bossActive && !bossDead && Math.hypot(hp.x - bossIsl.cx, hp.z - bossIsl.cz) < 17) startBoss();
      assignTokens();
      for (const e of enemies.slice()) updateEnemy(e, dt);
      for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
        const a = enemies[i].m.position, b = enemies[j].m.position, dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
        const min = (enemies[i].scale + enemies[j].scale) * 0.7;
        if (d > 0.001 && d < min) {
          const k = (min - d) / 2 / d;
          if (walkable(a.x - dx * k, a.z - dz * k, 0.4)) { a.x -= dx * k; a.z -= dz * k; }
          if (walkable(b.x + dx * k, b.z + dz * k, 0.4)) { b.x += dx * k; b.z += dz * k; }
        }
      }
      for (const p of projs) {
        p.m.position.x += p.vx * dt; p.m.position.z += p.vz * dt; p.m.rotation.y += dt * 8; p.m.rotation.x += dt * 5; p.life -= dt;
        if (p.reflected) {
          for (const e of enemies.slice()) {
            if (Math.hypot(p.m.position.x - e.m.position.x, p.m.position.z - e.m.position.z) < 0.9 + e.scale * 0.5) {
              p.life = 0; hurt(e, 2, p.vx * 0.5, p.vz * 0.5); burst(p.m.position.x, 1.3, p.m.position.z, [0xffe27a, 0xffffff], 8, 4); break;
            }
          }
        } else if (Math.hypot(p.m.position.x - hp.x, p.m.position.z - hp.z) < 0.9) {
          const r = hurtHero(1, p.m.position.x, p.m.position.z, 'proj', p);
          if (r === 'parry') {
            p.reflected = true; p.life = 3; p.m.material = cm(0xffe27a);
            const tgt = (p.owner && enemies.includes(p.owner)) ? p.owner : (nearestEnemy(30) || {}).e;
            const sp = Math.hypot(p.vx, p.vz) * 1.5;
            if (tgt) { const dx = tgt.m.position.x - p.m.position.x, dz = tgt.m.position.z - p.m.position.z, dd = Math.hypot(dx, dz) || 1; p.vx = dx / dd * sp; p.vz = dz / dd * sp; }
            else { p.vx *= -1.5; p.vz *= -1.5; }
          } else if (r) { p.life = 0; if (r === 'hit') burst(hp.x, 1.2, hp.z, [0xb36bff], 4, 3); }
        }
      }
      for (const p of projs) if (p.life > 0 && pillars.some((q) => Math.hypot(p.m.position.x - q.x, p.m.position.z - q.z) < q.r + 0.25)) { p.life = 0; burst(p.m.position.x, 1.3, p.m.position.z, [0x8a8a9c, 0xb36bff], 5, 3); }
      projs = projs.filter((p) => { if (p.life <= 0) { scene.remove(p.m); return false; } return true; });
      for (const enc of ENC) {
        if (!enc.spawned || enc.cleared) continue;
        const alive = enemies.filter((e) => e.enc === enc).length;
        if (enc.wi < enc.waves.length - 1) {
          if (alive <= Math.floor(enc.waves[enc.wi].length / 3)) { enc.nextT += dt; if (enc.nextT > 1.1) spawnWave(enc, enc.wi + 1); } else enc.nextT = 0;
        } else if (alive === 0) clearEncounter(enc, ENC.indexOf(enc));
      }
      for (const c of chests) if (!c.opened && Math.hypot(hp.x - c.x, hp.z - c.z) < 2.6) {
        c.opened = true; dropStuds(c.x, c.z, 14); dropHeart(c.x, c.z); dropHeart(c.x + 1, c.z + 1); toast('Treasure!', 1400);
      }
      setCd($('roll'), hero.rollCd / 0.85); setCd($('block'), hero.guardBreak > 0 ? 1 : 1 - hero.stamina / 100); $('stamfill').style.width = hero.stamina + '%'; setCd($('spec'), hero.specCd / 8); setCd($('dash'), hero.dashCd / 4);
      objT -= dt; if (objT <= 0) { objT = 0.25; updateObjective(); }
    } else {
      endTimer -= dt;
      if (mode === 'won' && crystal) { crystal.position.y += (2.6 - crystal.position.y) * 2 * dt; crystal.rotation.y += dt * 2; }
      if (endTimer <= 0 && $('overlay').style.display === 'none') {
        if (mode === 'won') showOverlay('Crystal found!', 'The Skybrick Isles are colorful again', 'Morvo Murk is beaten. New power unlocked: ⚡ Lightning Dash. Zoom through bad guys!', 'Studs: ' + score, 'Play again');
        else showOverlay('Knocked out!', 'Morvo Murk wins this round', 'You restart at your last checkpoint with full hearts.', 'Studs: ' + score, 'Try again');
      }
    }
    for (const c of chests) c.lid.rotation.x += ((c.opened ? -1.25 : 0) - c.lid.rotation.x) * Math.min(1, dt * 8);
    if (bossActive && boss && enemies.includes(boss)) bossIsl.tp = clamp(1 - boss.hp / BOSS_MAX, 0, 0.97);
    // hero look
    hero.swing = Math.max(0, hero.swing - dt * 5);
    {
      const dA = Math.atan2(Math.sin(hero.face - hero.ry), Math.cos(hero.face - hero.ry));
      hero.ry += dA * Math.min(1, dt * 18); hero.m.rotation.y = hero.ry;
      const spd = mode === 'play' ? hero.speed : 0, f = clamp(spd / 10, 0, 1), u = hero.m.userData;
      hero.phase += dt * (6 + spd * 1.7);
      hero.m.rotation.x = f * 0.2 + hero.swing * 0.12;
      hero.m.position.y = hero.moving ? Math.abs(Math.sin(hero.phase)) * 0.07 : 0;
      const s = hero.moving ? Math.sin(hero.phase) * (0.5 + f * 0.6) : 0;
      u.legL.rotation.x = s; u.legR.rotation.x = -s; u.armL.rotation.x = -s * 0.8;
      u.armR.rotation.x = hero.swing > 0.01 ? -2.4 * hero.swing : s * 0.8;
      if (u.cape) u.cape.rotation.x = 0.15 + f * 0.9 + Math.sin(t * 12) * 0.08 * f;
      if (u.shield) { u.shield.visible = hero.guard; if (hero.guard) { u.armL.rotation.x = -1.5; u.shield.material.emissiveIntensity = hero.guardT < 0.25 ? 1.8 : 0.6; } }
      if (hero.rollT > 0) { const pr = 1 - hero.rollT / ROLL_T; hero.m.rotation.x = pr * TAU; hero.m.position.y = Math.sin(pr * Math.PI) * 0.7; u.legL.rotation.x = u.legR.rotation.x = 0.9; u.armL.rotation.x = u.armR.rotation.x = -1.1; }
    }
    hero.flashT -= dt; applyFlash(hero);
    if (mode === 'play') hero.m.visible = hero.rollT > 0 || hero.inv <= 0 || hero.flashT > 0 || Math.floor(t * 10) % 2 === 0;
    // pickups
    for (const k of pickups) {
      const kp = k.m.position;
      if (!k.ground) {
        k.vy -= 20 * dt; kp.x += k.vx * dt; kp.y += k.vy * dt; kp.z += k.vz * dt;
        if (kp.y <= 0.45) { kp.y = 0.45; k.ground = true; }
        if (!walkable(kp.x, kp.z, 0)) { kp.y = -50; k.done = true; }
      } else if (mode === 'play') {
        const d = Math.hypot(hp.x - kp.x, hp.z - kp.z);
        if (d < 4) { kp.x += ((hp.x - kp.x) / (d || 1)) * 13 * dt; kp.z += ((hp.z - kp.z) / (d || 1)) * 13 * dt; }
        if (d < 0.8) {
          k.done = true;
          if (k.kind === 'stud') { score++; $('studs').textContent = '● ' + score; }
          else if (hero.hp < HERO_MAX) { hero.hp = Math.min(HERO_MAX, hero.hp + 2); updateHud(); ringFx(hp.x, hp.z, 0xff5577, 2, 0.4); }
        }
      }
      k.m.rotation.y += dt * 4; if (k.ground) kp.y = 0.55 + Math.sin(t * 4 + kp.x) * 0.08;
    }
    pickups = pickups.filter((k) => { if (k.done) { scene.remove(k.m); return false; } return true; });
    // camera and light follow the hero
    const inArena = Math.hypot(hp.x - bossIsl.cx, hp.z - bossIsl.cz) < bossIsl.r;
    camScale += ((inArena ? 1.25 : 1) - camScale) * Math.min(1, dt * 1.5);
    want.set(hp.x + hero.vx * 0.06, 11.5 * camScale * camZoom, hp.z + 9 * camScale * camZoom + hero.vz * 0.06);
    if (camSnap) { camPos.copy(want); camLook.set(hp.x, 0, hp.z - 1.5); camSnap = false; }
    camPos.lerp(want, 1 - Math.exp(-dt * 6)); camLook.lerp(camFocus.set(hp.x + hero.vx * 0.1, 0, hp.z - 1.5 + hero.vz * 0.1), 1 - Math.exp(-dt * 7));
    
    sun.position.set(hp.x + 14, 28, hp.z + 10); sun.target.position.set(hp.x, 0, hp.z);
  }
  // falling bad guys
  for (const f of fallers) { f.t += dt; f.vy -= 30 * dt; f.m.position.y += f.vy * dt; f.m.rotation.z += f.spin * dt; f.m.rotation.x += f.spin * dt * 0.6; }
  fallers = fallers.filter((f) => { if (f.m.position.y < -60) { scene.remove(f.m); return false; } return true; });
  // particles / fx
  for (const p of parts) {
    p.vy -= 18 * dt; p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
    if (p.m.position.y < 0.15 && walkable(p.m.position.x, p.m.position.z, 0)) { p.m.position.y = 0.15; p.vy *= -0.3; p.vx *= 0.7; p.vz *= 0.7; }
    p.life -= dt; if (p.life < 0.25) p.m.scale.setScalar(Math.max(0.01, p.life / 0.25));
  }
  parts = parts.filter((p) => { if (p.life <= 0 || p.m.position.y < -40) { scene.remove(p.m); return false; } return true; });
  for (const f of fxs) { f.t += dt; f.fn(Math.min(1, f.t / f.dur), f.mesh); }
  fxs = fxs.filter((f) => { if (f.t >= f.dur) { scene.remove(f.mesh); return false; } return true; });
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').style.opacity = 0; }
  camera.position.copy(camPos);
  if (shake > 0.002) { camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake * 0.6; shake *= Math.exp(-9 * dt); }
  camera.lookAt(camLook);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

// start screen (menu): show the hero on the landing island
islands.forEach((i) => { i.p = i.idx === 0 ? 1 : 0; i.tp = i.p; paintIsland(i); });
hero = makeHero();
updateHud();
showOverlay('Brick Elementals', 'The Skybrick Isles',
  'Morvo Murk stole the Core and turned Studland gray. Fight across the floating islands, beat his helpers, and win back the crystal!',
  'Stick to move and aim. 💨 swings (the 3rd hit is a big one). Hold 🛡 to block, and press it just as a hit lands to PARRY. 🤸 rolls through attacks. 🌪 pulls everyone together.', 'Play');
globalThis.__dbg = () => ({ get projs() { return projs; }, get hero() { return hero; }, get enemies() { return enemies; }, ENC, gates, islands, chests, get boss() { return boss; }, get mode() { return mode; }, stick, spawnEnemy, startGame, pauseGame, resumeGame, dodgeRoll, hurt, hurtHero, killEnemy, walkable, tornado, lightningDash, retry, get bossActive() { return bossActive; } });
