<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ninja Saga">
<meta name="theme-color" content="#0f3d40">
<title>Ninja Saga __BUILD__</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{position:fixed;top:0;left:0;width:100%;height:var(--vh,100%);margin:0;overflow:hidden;overscroll-behavior:none;background:#0f3d40;color:#fff;font-family:-apple-system,system-ui,sans-serif;touch-action:none}
#stage,#gl,#vig,#hud,#in{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
#vig{pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(15,61,64,0) 55%,rgba(15,61,64,.9) 100%)}
#hud{pointer-events:none}
#in{touch-action:none;z-index:3}
#hp{position:absolute;top:14px;left:44px;width:200px;height:16px;border:2px solid #fff;background:#1f2421;overflow:hidden}
#hp i{display:block;width:100%;height:100%;background:#d62828;transform-origin:left center;transform:scaleX(1)}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;font-weight:700;letter-spacing:.5px;color:#fff;background:rgba(11,13,12,.55);border:2px solid rgba(0,245,212,.75);transition:transform .06s,background .06s}
.btn.on{transform:scale(.92);background:rgba(0,245,212,.35)}
#stBase{position:absolute;top:0;left:0;width:112px;height:112px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:none}
#stThumb{position:absolute;top:0;left:0;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.4);display:none}
#lock{position:absolute;top:0;left:0;width:32px;height:32px;border:3px solid #00f5d4;border-radius:4px;display:none;margin:0}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.full{position:fixed;top:0;left:0;width:100%;height:var(--vh,100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9}
#start{background:#0f3d40;z-index:10}
#start h1{margin:0 0 4px;font-size:34px;letter-spacing:3px}
#start p{margin:4px 0;font-size:16px;opacity:.9}
#startMsg{margin-top:18px;font-size:22px;color:#00f5d4}
#rot,#tap{display:none;background:rgba(11,13,12,.88);font-size:22px;z-index:12}
#ov{display:none;position:fixed;top:44px;left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));bottom:8px;z-index:8;flex-direction:column;font:13px/1.4 -apple-system,system-ui,sans-serif;background:rgba(11,13,12,.94);border:1px solid #2f3a35;border-radius:10px;overflow:hidden}
#ov.narrow{left:260px;right:auto;width:330px;bottom:auto;max-height:calc(100% - 52px);background:rgba(11,13,12,.62);pointer-events:none;font:12px/1.35 ui-monospace,Menlo,monospace}
#ov.narrow button,#ov.narrow input,#ov.narrow .scroll{pointer-events:auto}
#ov pre{margin:4px 8px;font:inherit;white-space:pre-wrap}
#ov .tabs{display:flex;gap:4px;padding:4px;flex:none}
#ov .tabs .go{margin-left:auto;background:#0f6b66;border-color:#00f5d4}
#ov button{font:inherit;color:#fff;background:#25302c;border:1px solid #4a5a54;border-radius:6px;padding:8px 11px;touch-action:manipulation}
#ov button.sel{background:#0f6b66;border-color:#00f5d4}
#ov .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:2px 10px 10px}
#ov .narrow .scroll,#ov.narrow .scroll{max-height:320px}
#ov .intro{margin:6px 0}
#ov .step{margin:8px 0;padding:6px 8px;background:rgba(255,255,255,.06);border-radius:8px}
#ov .step p{margin:4px 0}
#ov .step>b:first-child{float:right}
#ov small{display:block;opacity:.75;font-size:11px}
#ov .row{display:flex;align-items:center;gap:6px;margin:5px 0}
#ov .row span{flex:1}
#ov .row.wrap{flex-wrap:wrap}
#ov .row input[type=color]{width:56px;height:34px;padding:0;border:1px solid #4a5a54;background:none}
#ov b.PASS,#ov b.SEEN{color:#6dff9a}#ov b.FAIL{color:#ff6b6b}#ov b.RUNNING{color:#ffd45c}#ov b.PENDING{color:#9aa5a0}
#ov textarea{width:100%;font:11px ui-monospace,Menlo,monospace;background:#111;color:#ddd;border:1px solid #444;-webkit-user-select:text;user-select:text}
#bar{position:fixed;top:6px;left:256px;right:8px;z-index:11;display:flex;align-items:center;gap:6px;pointer-events:none}
#bar button{pointer-events:auto;font:700 12px -apple-system,system-ui,sans-serif;color:#fff;background:rgba(11,13,12,.7);border:1px solid #00f5d4;border-radius:6px;padding:7px 10px;touch-action:manipulation}
#banner{display:none;flex:0 1 auto;min-width:0;align-items:center;gap:6px;font:12px/1.3 -apple-system,system-ui,sans-serif;background:rgba(11,13,12,.72);border-radius:6px;padding:5px 8px;pointer-events:none}
#info{display:none;position:fixed;top:38px;left:44px;z-index:7;font:11px/1.3 ui-monospace,Menlo,monospace;background:rgba(11,13,12,.55);border-radius:4px;padding:3px 6px;pointer-events:none}
#toast{display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:13;max-width:70%;background:#0f6b66;border:1px solid #00f5d4;border-radius:8px;padding:9px 12px;font:13px -apple-system,system-ui,sans-serif;text-align:center;pointer-events:none}
#start button{font:700 20px -apple-system,system-ui,sans-serif;color:#fff;background:#0f6b66;border:2px solid #00f5d4;border-radius:10px;padding:12px 30px;margin:6px;touch-action:manipulation}
#start button.alt{background:#25302c;border-color:#4a5a54;font-size:16px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="vig"></div>
<div id="hud"><div id="hp"><i></i></div><div id="stBase"></div><div id="stThumb"></div><div id="lock"></div></div>
<div id="in"></div>
<div id="ov"></div>
<div id="bar"><div id="banner"><span id="bt"></span><button data-act="stop">Stop</button></div><button id="pb">PAL</button><button id="tb">TEST</button></div>
<div id="info"></div>
<div id="toast"></div>
<div id="probe"></div>
<div id="rot" class="full">Rotate your phone to landscape</div>
<div id="tap" class="full">Tap to continue</div>
<div id="start" class="full">
  <h1>NINJA SAGA</h1>
  <p>M1 Storm movement</p>
  <p id="ver"></p>
  <p>Landscape only.</p>
  <div><button id="playBtn">Play</button><button id="testBtn" class="alt">Run tests</button></div>
  <div id="startMsg"></div>
</div>
<script>

</script>
<script>
/*SIM*/
</script>
<script>
/*APP*/
</script>
</body>
</html>
